services:
  db:
    image: pgvector/pgvector:pg16
    container_name: purrple-prose-db
    environment:
      POSTGRES_USER: purrple
      POSTGRES_PASSWORD: prose
      POSTGRES_DB: purrple_prose
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purrple -d purrple_prose"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
